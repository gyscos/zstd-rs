name: Wasm

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    # GitHub's runner, unless the LINUX_RUNNER repository variable names
    # another (`self-hosted`, to save Actions minutes). Forks don't see it.
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}

    steps:
    - name: Wasm target
      run: rustup target add wasm32-unknown-unknown
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Build
      run: cargo build --verbose --target wasm32-unknown-unknown
    - name: Build with feature thin
      run: cargo build --verbose --features thin --target wasm32-unknown-unknown

  wasm64:

    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    # A tier-3 target, on nightly: don't let a nightly regression block PRs.
    continue-on-error: true

    steps:
    - name: Nightly toolchain with the standard library's source
      run: rustup toolchain install nightly --profile minimal --component rust-src
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Build
      run: cargo +nightly build --verbose -Zbuild-std=std,panic_abort --target wasm64-unknown-unknown
