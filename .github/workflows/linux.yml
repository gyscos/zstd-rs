name: Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

    - name: Build with feature thin
      run: cargo build --verbose --features thin
    - name: Run tests
      run: cargo test --verbose --features thin

    - name: Build with feature with-rust-allocator
      run: cargo build --verbose --features with-rust-allocator
    - name: Run tests with feature with-rust-allocator
      run: cargo test --verbose --features with-rust-allocator
    - name: Run zstd-safe tests with Rust allocator
      run: cargo test --manifest-path zstd-safe/Cargo.toml --verbose --features std,with-rust-allocator
    - name: Check zstd-safe Rust allocator without std
      run: cargo check --manifest-path zstd-safe/Cargo.toml --no-default-features --features with-rust-allocator
    - name: Run zstd-safe tests with alloc but without std
      run: cargo test --manifest-path zstd-safe/Cargo.toml --verbose --features alloc

    - name: Build zstd-safe with feature seekable
      run: cargo build --manifest-path zstd-safe/Cargo.toml --verbose --features seekable
    - name: Run zstd-safe tests with feature seekable
      run: cargo test --manifest-path zstd-safe/Cargo.toml --verbose --features seekable
    - name: Build zstd-safe with features std and seekable
      run: cargo build --manifest-path zstd-safe/Cargo.toml --verbose --features std,seekable
    - name: Run zstd-safe tests with features std and seekable
      run: cargo test --manifest-path zstd-safe/Cargo.toml --verbose --features std,seekable

  # The libzstd-rs-sys Rust port, in place of the C library.
  rust-backend:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Run tests
      run: cargo test --verbose --features rust-backend
    - name: Run tests without default features
      run: cargo test --verbose --no-default-features --features rust-backend
    - name: Run tests with features experimental, zstdmt and with-rust-allocator
      run: cargo test --verbose --features rust-backend,experimental,zstdmt,with-rust-allocator
    - name: Run zstd-safe tests
      run: cargo test --manifest-path zstd-safe/Cargo.toml --verbose --features rust-backend,std,experimental
    # Only zstd-safe's own tests cover these, not the zstd runs above.
    - name: Run zstd-safe tests with features zstdmt and with-rust-allocator
      run: cargo test --manifest-path zstd-safe/Cargo.toml --verbose --features rust-backend,std,zstdmt,with-rust-allocator
    - name: Refuse the seekable feature
      run: |
        ! cargo check --manifest-path zstd-safe/Cargo.toml --features rust-backend,seekable 2> seekable.log
        grep -F 'is not supported with `rust-backend`' seekable.log
